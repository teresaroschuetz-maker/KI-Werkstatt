name: Auf easyname veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien aus GitHub holen
        uses: actions/checkout@v4

      - name: Upload-Programm installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Dateien verschlüsselt zu easyname hochladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            open '$FTP_SERVER';
            user '$FTP_USERNAME' '$FTP_PASSWORD';
            mirror --reverse --verbose --parallel=2 \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              ./ ./
          "
